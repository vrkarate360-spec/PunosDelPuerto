name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto y juego
        run: |
          P=$(ls PunosDelPuerto-proyecto*.zip | head -1)
          unzip -o "$P" -d proyecto
          mkdir -p proyecto/app/src/main/assets
          for f in juego-parte*.zip; do unzip -o "$f" -d proyecto/app/src/main/assets; done
          ls -la proyecto/app/src/main/assets proyecto/app/src/main/assets/d

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Preparar archivo
        run: cp proyecto/app/build/outputs/apk/debug/app-debug.apk PunosDelPuerto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PunosDelPuerto
          path: PunosDelPuerto.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Puños del Puerto v${{ github.run_number }}
          files: PunosDelPuerto.apk
